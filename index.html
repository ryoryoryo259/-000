<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e9">
  <title>揚げ日和 | 学園祭の売上管理</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="揚げ日和 ホーム">
        <span>揚げ日和</span>
      </a>
      <span class="live-badge"><span class="live-dot"></span>営業中</span>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">SCHOOL FESTIVAL · SALES</p>
      <h1 id="page-title">今日の売上を<span>かんたん管理</span></h1>
      <p class="intro-copy">商品を販売したら、ボタンを押すだけ。</p>
    </section>

    <section class="summary" aria-label="売上サマリー">
      <article class="summary-card sales-card">
        <div class="summary-label"><span class="summary-icon" aria-hidden="true">¥</span>合計売上</div>
        <p class="summary-value" id="total-sales" aria-live="polite">¥0</p>
        <p class="summary-note">今日の売上合計</p>
      </article>
      <article class="summary-card">
        <div class="summary-label"><span class="summary-icon items-icon" aria-hidden="true">↗</span>販売数</div>
        <p class="summary-value" id="total-quantity" aria-live="polite">0<span class="value-unit">個</span></p>
        <p class="summary-note">販売した商品の合計</p>
      </article>
    </section>

    <section class="menu-section" aria-labelledby="menu-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR MENU</p>
          <h2 id="menu-title">販売メニュー</h2>
        </div>
        <div class="menu-tools">
          <button class="undo-button" id="undo-button" type="button" disabled>↶ 取り消す</button>
          <span class="menu-count" id="menu-count">0品</span>
        </div>
      </div>

      <div class="product-list" id="product-list" aria-live="polite"></div>

      <form class="add-product" id="add-product-form">
        <div class="form-heading">
          <span class="add-icon" aria-hidden="true">＋</span>
          <div>
            <h3>メニューを追加</h3>
            <p>販売する商品と価格を登録できます</p>
          </div>
        </div>
        <div class="form-fields">
          <label class="field field-name">
            <span>商品名</span>
            <input id="product-name" name="name" type="text" maxlength="30" placeholder="例：チョコバナナ" required>
          </label>
          <label class="field field-price">
            <span>価格</span>
            <span class="price-input-wrap">
              <span aria-hidden="true">¥</span>
              <input id="product-price" name="price" type="number" min="1" max="999999" step="1" placeholder="400" required>
            </span>
          </label>
          <button class="add-button" type="submit">商品を追加 <span aria-hidden="true">＋</span></button>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
      </form>
    </section>

    <footer class="footer">
      <span>学園祭の思い出も、売上も。</span>
      <span class="storage-status" id="storage-status" role="status" aria-live="polite">保存先を確認中...</span>
      <button class="reset-button" id="reset-button" type="button">売上をリセット</button>
    </footer>
  </main>
</body>
</html>
